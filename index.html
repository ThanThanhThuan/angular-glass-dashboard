<style>:root{--emerald:#059669;--emerald-light:#34d399;--gold:#d4a574;--gold-light:#e8c9a0;--amber:#b45309;--cream:#fef3e2;--coral:#e07a5f;--slate:#475569;--glass-bg:rgba(255, 255, 255, .05);--glass-border:rgba(255, 255, 255, .1);--glass-shadow:rgba(0, 0, 0, .3);--glass-hover:rgba(255, 255, 255, .08);--bg-dark:#0a0f0d;--bg-gradient-1:#0d1a14;--bg-gradient-2:#132419;--bg-gradient-3:#1a2e23;--text-primary:#f5f5f4;--text-secondary:rgba(245, 245, 244, .7);--text-muted:rgba(245, 245, 244, .4);--success:#22c55e;--warning:#eab308;--danger:#dc2626;--info:#0ea5e9;--sidebar-width:280px;--navbar-height:70px;--border-radius:20px;--card-padding:24px;--transition-fast:.2s ease;--transition-normal:.3s ease;--transition-slow:.5s ease}*,*:before,*:after{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:Outfit,sans-serif;background:var(--bg-dark);color:var(--text-primary);min-height:100vh;overflow-x:hidden;line-height:1.6}.background{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;background:linear-gradient(135deg,var(--bg-gradient-1) 0%,var(--bg-gradient-2) 50%,var(--bg-gradient-3) 100%)}.background:before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse 80% 50% at 20% 40%,rgba(120,0,255,.15) 0%,transparent 50%),radial-gradient(ellipse 60% 40% at 80% 60%,rgba(0,200,255,.12) 0%,transparent 50%),radial-gradient(ellipse 50% 30% at 50% 80%,rgba(255,0,200,.1) 0%,transparent 50%)}.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.4;z-index:-1;animation:float 20s ease-in-out infinite}.orb-1{width:400px;height:400px;background:var(--emerald);top:10%;left:10%;animation-delay:0s}.orb-2{width:350px;height:350px;background:var(--gold);top:60%;right:10%;animation-delay:-5s}.orb-3{width:300px;height:300px;background:var(--coral);bottom:10%;left:30%;animation-delay:-10s}@keyframes float{0%,to{transform:translate(0) scale(1)}25%{transform:translate(30px,-30px) scale(1.05)}50%{transform
