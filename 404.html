<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>AngularGlassDashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- 1. Preconnect to Google Fonts (Improves loading speed) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- 2. The actual Font Definitions -->
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">

</head>

<body>

  <!-- 1. The Glassmorphism Background (Global) -->
  <div class="background"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- 2. The Angular App Root -->
  <app-root></app-root>

</body>

</html>
